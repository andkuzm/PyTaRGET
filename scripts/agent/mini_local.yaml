# Overrides for mini-swe-agent (merged after the built-in mini.yaml: `-c mini.yaml -c mini_local.yaml`) for a local vLLM server (Qwen3-Coder, tool calling).
agent:
  step_limit: 40          # one case: at most 40 model calls
  cost_limit: 0.
  mode: yolo
environment:
  timeout: 180            # one command
model:
  model_name: hosted_vllm/qwen3-coder
  cost_tracking: ignore_errors
  model_kwargs:
    api_base: http://localhost:8000/v1
    api_key: dummy
    temperature: 0.7
    max_tokens: 2048
    drop_params: true
